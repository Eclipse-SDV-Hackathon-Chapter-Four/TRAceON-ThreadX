# Mosquitto config for the eclipse-mosquitto Docker container (LOCAL DEV ONLY).
# Mounted into the container at /mosquitto/config/mosquitto.conf.
#
# Run:
#   docker run -d --name traceon-broker -p 1883:1883 \
#     -v "$PWD/scripts/mosquitto-docker.conf:/mosquitto/config/mosquitto.conf" \
#     eclipse-mosquitto:2
#
# Rationale: publishing the port via Docker (-p) routes inbound traffic through
# Docker's network layer, which can bypass the macOS per-app application firewall
# that blocks the native mosquitto binary on this managed Mac.

listener 1883 0.0.0.0
allow_anonymous true

# Keep logs on stdout so `docker logs` shows connections.
log_dest stdout
log_type all
